[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nothing-x-desktop-unofficial"
dynamic = ["version"]
description = "Unofficial desktop companion for Nothing and CMF earbuds: battery, ANC, equalizer, gestures and more from the system tray."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Raffaele Caccia" }]
keywords = ["nothing", "cmf", "earbuds", "bluetooth", "anc", "equalizer", "tray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=9"]                 # Linux / macOS status-bar icon
macos = ["pystray>=0.19", "Pillow>=9", "pyobjc-framework-IOBluetooth>=9"]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/raffycaccia/nothing-x-desktop-unofficial"
Issues = "https://github.com/raffycaccia/nothing-x-desktop-unofficial/issues"
Changelog = "https://github.com/raffycaccia/nothing-x-desktop-unofficial/blob/main/CHANGELOG.md"

[project.scripts]
nothingx = "nothingx.app:main"

[project.gui-scripts]
nothingx-gui = "nothingx.app:main"

[tool.setuptools]
packages = ["nothingx"]

[tool.setuptools.package-data]
nothingx = ["ui.html", "models.json", "icon.ico", "icon.png"]

[tool.setuptools.dynamic]
version = { attr = "nothingx.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
