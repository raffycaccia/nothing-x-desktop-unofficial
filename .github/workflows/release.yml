name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            artifact: NothingX-Desktop-unofficial-windows-x64.exe
          - os: ubuntu-22.04
            name: linux-x64
            artifact: NothingX-Desktop-unofficial-linux-x64.tar.gz
          - os: macos-latest  # Apple Silicon; Intel Macs: pip install (macos-13 runners queue for too long)
            name: macos-arm64
            artifact: NothingX-Desktop-unofficial-macos-arm64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,tray]"
      - run: python -m pip install pyobjc-framework-IOBluetooth
        if: runner.os == 'macOS'
      - run: python -m pytest
      - run: pyinstaller nothingx.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/NothingX.exe ${{ matrix.artifact }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/nothingx
          cp dist/NothingX pkg/nothingx/nothingx
          cp packaging/nothingx.desktop packaging/install.sh nothingx/icon.png pkg/nothingx/
          tar -C pkg -czf ${{ matrix.artifact }} nothingx
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/NothingX.app ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
