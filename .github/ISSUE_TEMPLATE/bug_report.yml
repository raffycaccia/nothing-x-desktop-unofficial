name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. The details below are what we need to reproduce it.
  - type: input
    id: device
    attributes:
      label: Earbuds model
      placeholder: e.g. CMF Buds Pro 2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, Linux, macOS]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings page, or `nothingx --version`
      placeholder: v0.1.0 (release .exe / pip / source)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Run from a terminal with `python -m nothingx` to see tracebacks.
      render: text
