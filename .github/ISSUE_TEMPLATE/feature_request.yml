name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: If the official Nothing X app has it, a screenshot of that screen helps a lot.
  - type: input
    id: device
    attributes:
      label: Earbuds model (if model-specific)
